<input [type]="type()" #datepicker [id]="controlId()" [disabled]="disabled" [ngClass]="styleClass()" [value]="value"
    (input)="onInputChange(datepicker.value)" (blur)="markAsTouched()" [min]="min()" [max]="max()" />


@if(validationErrors && (isTouched || isDirty)) {
<ngcc-validation-messages [errorMessages]="errorMessages"></ngcc-validation-messages>
}
