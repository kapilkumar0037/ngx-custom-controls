<input type="radio" #radio [ngClass]="styleClass()" [disabled]="disabled" [value]="option()"
    [checked]="value===option()" (change)="onInputChange(radio.value)" (blur)="onTouched()">
<ng-content></ng-content>

@if(validationErrors && (isTouched || isDirty)) {
<ngcc-validation-messages [errorMessages]="errorMessages"></ngcc-validation-messages>
}
