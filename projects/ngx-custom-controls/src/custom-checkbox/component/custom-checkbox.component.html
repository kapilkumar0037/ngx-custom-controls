<input [id]="controlId()" #checkbox [ngClass]="styleClass()" [disabled]="disabled" type="checkbox" [checked]="value"
    (change)="onInputChange(checkbox.checked)" (blur)="onTouched()">
<ng-content></ng-content>

@if(validationErrors && (isTouched || isDirty)) {
<ngcc-validation-messages [errorMessages]="errorMessages"></ngcc-validation-messages>
}
